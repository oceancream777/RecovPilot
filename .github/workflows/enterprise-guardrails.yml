name: RecovPilot CI/CD Guardrails

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  enforce-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate 1 - Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov

      - name: Gate 2 - Strict Type and API Contract Check (Mypy)
        run: mypy app/schemas.py app/webhook_log.py --strict

      - name: Gate 3 - Fast Linter and Syntax Guard (Ruff)
        run: ruff check app

      - name: Gate 4 - Logic, Idempotency and Coverage (Pytest)
        run: pytest tests --cov=app --cov-fail-under=85
